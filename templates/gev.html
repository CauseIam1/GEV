<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>GEV — God's Eye View // Polaris</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.115.0/Build/Cesium/Widgets/widgets.css"/>
<style>
  :root { --cy:#22d3ee; --am:#f59e0b; --bg:#09090b; }
  html,body { margin:0; padding:0; height:100%; background:var(--bg); overflow:hidden;
    font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace; color:#e4e4e7; }
  #cesiumContainer { position:absolute; inset:0; }
  .hud-chip { background:rgba(9,9,11,.82); border:1px solid rgba(34,211,238,.25);
    border-radius:.35rem; backdrop-filter:blur(6px); }
  #gev-topbar { position:absolute; top:10px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:14px; padding:8px 14px; z-index:10; }
  #gev-identity { font-weight:800; letter-spacing:.22em; font-size:13px; color:var(--cy);
    text-shadow:0 0 12px rgba(34,211,238,.55); white-space:nowrap; }
  #gev-identity small { display:block; font-size:9px; letter-spacing:.3em; color:#71717a; }
  .layer-btn { cursor:pointer; font-size:10px; letter-spacing:.12em; padding:5px 9px;
    border:1px solid rgba(34,211,238,.3); border-radius:.3rem; color:#a1a1aa; transition:all .15s; user-select:none; }
  .layer-btn.on { color:var(--cy); border-color:var(--cy); background:rgba(34,211,238,.12);
    box-shadow:0 0 10px rgba(34,211,238,.25); }
  .layer-btn:hover { color:#fff; }
  #cam-readout { font-size:10px; letter-spacing:.08em; color:#a1a1aa; white-space:nowrap; }
  #link-status { display:flex; gap:10px; font-size:9px; letter-spacing:.1em; }
  .dot { width:7px; height:7px; border-radius:50%; background:#3f3f46; display:inline-block;
    margin-right:4px; vertical-align:middle; }
  .dot.live { background:var(--cy); box-shadow:0 0 8px var(--cy); animation:pulse 1.6s infinite; }
  .dot.warn { background:var(--am); box-shadow:0 0 8px var(--am); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
  /* ---------- bottom HUD dock (v1.2): OPERATOR — RICH · POLARIS chat · COMMAND LOG ---------- */
  #gev-dock { position:absolute; left:10px; right:10px; bottom:10px; z-index:10;
    display:flex; align-items:stretch; gap:10px; }
  #operator-card { flex:0 0 auto; min-width:235px; max-width:270px; padding:10px 12px;
    font-size:11px; line-height:1.65; }
  #operator-card h3 { margin:0 0 4px; font-size:10px; letter-spacing:.25em; color:var(--cy); }
  #operator-card .no-fix { color:var(--am); letter-spacing:.15em; font-size:10px; }
  #operator-card .fix-val { color:#fafafa; }
  #operator-card .stale { color:var(--am); }
  #cmd-log { flex:0 0 auto; width:275px; overflow:hidden;
    padding:8px 10px; font-size:9.5px; line-height:1.7; color:#8f8f98; }
  #cmd-log b { color:var(--cy); font-weight:600; }
  #cmd-log h4 { margin:0 0 4px; font-size:9px; letter-spacing:.25em; color:#a1a1aa; }
  /* Polaris chat — docked dead-center between the operator card and the command log */
  #polaris-dock { flex:1 1 auto; min-width:0; display:flex; flex-direction:column;
    height:min(24vh,215px); }
  #polaris-dock .side-head { display:flex; justify-content:space-between; align-items:center;
    gap:12px; padding:6px 12px; border-bottom:1px solid rgba(34,211,238,.2);
    font-size:11px; letter-spacing:.22em; color:var(--cy); white-space:nowrap; }
  #polaris-dock .side-head small { font-size:8.5px; letter-spacing:.18em; color:#71717a; }
  #chat-scroll { flex:1; overflow-y:auto; padding:8px 12px; font-size:11px; line-height:1.55;
    background:rgba(9,9,11,.45); }
  .msg { margin-bottom:8px; } .msg .who { font-size:9px; letter-spacing:.2em; color:#71717a; }
  .msg.polaris .who { color:var(--cy); } .msg .txt { white-space:pre-wrap; color:#e4e4e7; }
  #chat-form { display:flex; gap:6px; padding:8px 10px; border-top:1px solid rgba(34,211,238,.2); }
  #chat-input { flex:1; background:#101013; border:1px solid #27272a; color:#e4e4e7;
    font:inherit; font-size:11px; padding:8px; border-radius:.3rem; outline:none; }
  #chat-input:focus { border-color:var(--cy); }
  #chat-form button { background:rgba(34,211,238,.15); border:1px solid var(--cy); color:var(--cy);
    font:inherit; font-size:10px; letter-spacing:.15em; padding:0 12px; border-radius:.3rem; cursor:pointer; }
  .boot-msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    z-index:20; letter-spacing:.3em; font-size:12px; color:var(--cy); text-shadow:0 0 14px rgba(34,211,238,.6); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="cesiumContainer"></div>

<header id="gev-topbar" class="hud-chip">
  <div id="gev-identity">GOD'S EYE VIEW<small>GEV-1 · POLARIS TACTICAL GLOBE</small></div>
  <nav id="layer-strip">
    <span class="layer-btn on" data-layer="dark">DARK</span>
    <span class="layer-btn" data-layer="osm">OSM</span>
    <span class="layer-btn" data-layer="imagery">IMAGERY</span>
    <span class="layer-btn" data-layer="buildings3d">3D BLDGS</span>
  </nav>
  <div id="cam-readout">CAM — · —</div>
  <div id="link-status">
    <span><span id="dot-gev" class="dot"></span>GEV</span>
    <span><span id="dot-gps" class="dot"></span>GPS</span>
    <span><span id="dot-polaris" class="dot"></span>POLARIS</span>
  </div>
</header>

<footer id="gev-dock">
  <aside id="operator-card" class="hud-chip">
    <h3>OPERATOR — RICH</h3>
    <div id="op-body"><span class="no-fix">◉ NO GPS FEED — AWAITING BURST RECEIVER</span></div>
  </aside>

  <section id="polaris-dock" class="hud-chip">
    <div class="side-head"><span>POLARIS // GEV COMMAND LINE</span><small>[P] HIDE / SHOW</small></div>
    <div id="chat-scroll"></div>
    <form id="chat-form"><input id="chat-input" autocomplete="off" placeholder="Task Polaris…"/>
      <button type="submit">SEND</button></form>
  </section>

  <aside id="cmd-log" class="hud-chip"><h4>COMMAND LOG</h4><div id="cmd-lines">— bridge idle</div></aside>
</footer>

<div id="boot" class="boot-msg">ESTABLISHING GOD'S EYE VIEW…</div>

<script>window.CESIUM_BASE_URL='https://cdn.jsdelivr.net/npm/cesium@1.115.0/Build/Cesium/';</script>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.115.0/Build/Cesium/Cesium.js"></script>
<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.4/dist/socket.io.min.js"></script>
<script>
'use strict';
const BURST_WS='{{ GEV_BURST_WS_URL }}', GATEWAY='{{ GEV_GATEWAY_URL }}', ION_TOKEN='{{ GEV_ION_TOKEN }}';
const $=(id)=>document.getElementById(id);
// ---------- boot guards ----------
function setDot(id, state){ const d=$(id); if(!d) return; d.classList.remove('live','warn'); if(state) d.classList.add(state); }
function bootFail(msg){ const b=$('boot'); if(b){ b.textContent='⚠ GEV BOOT FAILURE — '+msg; b.style.color='#f59e0b'; } }
if(!window.Cesium){ bootFail('Cesium.js failed to load (CDN)'); throw new Error('cesium missing'); }

function logLine(html){ const box=$('cmd-lines'); if(!box) return; const t=new Date().toTimeString().slice(0,8);
  const div=document.createElement('div'); div.innerHTML=t+' — '+html; box.prepend(div);
  while(box.children.length>9) box.lastChild.remove(); }

// ---------- viewer (zero-key v1: CARTO Dark Matter base, flat terrain) ----------
const layerFactories={
  osm:function(){ return new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/',credit:'© OpenStreetMap contributors'}); },
  imagery:function(){ return new Cesium.UrlTemplateImageryProvider({url:'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',credit:'Esri, Maxar, Earthstar Geographics',maximumLevel:18}); }
};
let viewer=null, ionUpgraded=false, buildingsTileset=null;
const dynLayers={};
try{
  if(ION_TOKEN){ Cesium.Ion.defaultAccessToken=ION_TOKEN; ionUpgraded=true; }
  const baseProvider=new Cesium.UrlTemplateImageryProvider({
    url:'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png', subdomains:'abcd',
    credit:'© OpenStreetMap contributors, © CARTO', maximumLevel:19 });
  viewer=new Cesium.Viewer('cesiumContainer',{
    baseLayer:new Cesium.ImageryLayer(baseProvider),
    terrainProvider:new Cesium.EllipsoidTerrainProvider(),
    baseLayerPicker:false, geocoder:false, homeButton:false, sceneModePicker:false,
    navigationHelpButton:false, animation:false, timeline:false, fullscreenButton:false,
    infoBox:false, selectionIndicator:false, creditContainer:document.createElement('div')
  });
  viewer.scene.globe.baseColor=Cesium.Color.fromCssColorString('#141417');
  viewer.scene.globe.enableLighting=false;
  if(ionUpgraded){
    Cesium.CesiumTerrainProvider.fromIonAssetId(1).then(function(t){ viewer.terrainProvider=t; logLine('Cesium World Terrain engaged'); })
      .catch(function(){ logLine('terrain upgrade skipped (ion)'); });
    // Cesium ≥1.107 removed the sync createOsmBuildings() — async form only.
    Cesium.createOsmBuildingsAsync().then(function(ts){
      buildingsTileset=viewer.scene.primitives.add(ts);
      buildingsTileset.show=false;  // OFF at boot — matches the 3D BLDGS strip button (off)
      logLine('OSM Buildings ready — 3D BLDGS to engage');
    }).catch(function(){ logLine('OSM Buildings unavailable (ion)'); });
  }
}catch(e){ console.error(e); bootFail(e.message||'viewer init'); throw e; }
const bootEl=$('boot'); if(bootEl) bootEl.classList.add('hidden');
logLine('globe online — zero-key v1'+(ionUpgraded?' + ion upgrades':''));

// camera readout (throttled)
let lastReadout=0;
viewer.scene.postRender.addEventListener(function(){
  const now=Date.now(); if(now-lastReadout<400) return; lastReadout=now;
  const c=viewer.camera.positionCartographic; if(!c) return;
  $('cam-readout').textContent='CAM '+Cesium.Math.toDegrees(c.longitude).toFixed(4)+'° · '+Cesium.Math.toDegrees(c.latitude).toFixed(4)+'° · H '+c.height.toFixed(0)+'m';
});
// ---------- operator (Rich) BEAR avatar + trail (v1.1) ----------
// Two cached data-URI sprites built from one SVG template: awake bear (open eyes, cyan glow pad)
// and sleepy bear (>120 s stale — closed eyes, amber pad, z/Z glyphs). The bear NEVER vanishes
// once placed; fixes only swap her state. Last-known fix survives page reloads via localStorage.
function bearSvg(headFill, muzzleFill, eyePath, ringFill, ringGlow, zGlyphs){
  return 'data:image/svg+xml,'+encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="60" viewBox="0 0 64 60">'+
    '<ellipse cx="32" cy="54" rx="17" ry="4.5" fill="'+ringFill+'" opacity="'+ringGlow+'"/>'+
    '<ellipse cx="32" cy="54" rx="13" ry="3" fill="none" stroke="'+ringFill+'" stroke-width="1.5" opacity=".9"/>'+
    '<circle cx="17" cy="16" r="9" fill="'+headFill+'" stroke="#241608" stroke-width="2.5"/>'+
    '<circle cx="47" cy="16" r="9" fill="'+headFill+'" stroke="#241608" stroke-width="2.5"/>'+
    '<circle cx="17" cy="16" r="4" fill="'+muzzleFill+'"/>'+
    '<circle cx="47" cy="16" r="4" fill="'+muzzleFill+'"/>'+
    '<circle cx="32" cy="31" r="20" fill="'+headFill+'" stroke="#241608" stroke-width="2.5"/>'+
    '<ellipse cx="32" cy="39" rx="11" ry="8.5" fill="'+muzzleFill+'" stroke="#241608" stroke-width="1.5"/>'+
    '<ellipse cx="32" cy="35" rx="4.2" ry="3.2" fill="#241608"/>'+
    '<path d="M27 40.5 Q32 44.5 37 40.5" fill="none" stroke="#241608" stroke-width="1.6" stroke-linecap="round"/>'+
    eyePath+zGlyphs+'</svg>');
}
const BEAR_LIVE=bearSvg('#8b5e34','#d9a86c',
  '<circle cx="24.5" cy="26" r="2.8" fill="#241608"/><circle cx="39.5" cy="26" r="2.8" fill="#241608"/>'+
  '<circle cx="25.4" cy="25.1" r=".9" fill="#eafcff"/><circle cx="40.4" cy="25.1" r=".9" fill="#eafcff"/>',
  '#22d3ee','.28','');
const BEAR_STALE=bearSvg('#6f5a40','#a98b62',
  '<path d="M21.5 26 Q24.5 29 27.5 26" fill="none" stroke="#241608" stroke-width="1.8" stroke-linecap="round"/>'+
  '<path d="M36.5 26 Q39.5 29 42.5 26" fill="none" stroke="#241608" stroke-width="1.8" stroke-linecap="round"/>',
  '#f59e0b','.16',
  '<text x="42" y="13" font-family="monospace" font-size="9" fill="#f59e0b">z</text>'+
  '<text x="49" y="19" font-family="monospace" font-size="12" fill="#f59e0b">Z</text>');
let operatorFix=null, operatorEntity=null, trailEntity=null, hasCentered=false, lastKnownRestore=false;
const trailPositions=[];
function onGpsFix(fix){
  try{
    if(!fix || typeof fix.lat!=='number' || typeof fix.lng!=='number'){ operatorFix=null; return; }
    operatorFix=fix;
    // cache every fix so the NEXT page load boots the bear at last-known (v1.1 boot-restore)
    try{ localStorage.setItem('gev_last_fix', JSON.stringify({ lat:fix.lat, lng:fix.lng, alt:fix.alt||0,
      speed:fix.speed||0, accuracy:fix.accuracy||0, heading:fix.heading||null,
      ts_epoch:fix.ts_epoch||Math.floor(Date.now()/1000) })); }catch(e){}
    const pos=Cesium.Cartesian3.fromDegrees(fix.lng, fix.lat, fix.alt||0);
    const hdg=Number(fix.heading), rot=Number.isFinite(hdg)?-Cesium.Math.toRadians(hdg):0; // face travel direction
    if(!operatorEntity){
      operatorEntity=viewer.entities.add({
        id:'operator-rich', position:pos,
        billboard:{ image:BEAR_LIVE, verticalOrigin:Cesium.VerticalOrigin.BOTTOM, width:44, height:41,
          rotation:rot, alignedAxis:Cesium.Cartesian3.UNIT_Z,
          scaleByDistance:new Cesium.NearFarScalar(1.0e3,1.5,8.0e6,0.6) },
        label:{ text:'RICH', font:'12px monospace', fillColor:Cesium.Color.fromCssColorString('#22d3ee'),
          style:Cesium.LabelStyle.FILL, pixelOffset:new Cesium.Cartesian2(0,-54) }
      });
    } else {
      operatorEntity.position=pos;
      if(operatorEntity.billboard){ operatorEntity.billboard.rotation=rot;
        operatorEntity.billboard.alignedAxis=Cesium.Cartesian3.UNIT_Z; }
    }
    if(!fix.restored) lastKnownRestore=false;   // live fix retires the LAST KNOWN tag
    trailPositions.push(Cesium.Cartesian3.fromDegrees(fix.lng, fix.lat, fix.alt||0));
    if(trailPositions.length>500) trailPositions.shift();
    if(!trailEntity){
      trailEntity=viewer.entities.add({ polyline:{ positions:trailPositions.slice(), width:2,
        material:Cesium.Color.fromCssColorString('#22d3ee').withAlpha(0.5) } });
    } else { trailEntity.polyline.positions=trailPositions.slice(); }
    renderOperatorCard(fix);
    if(!hasCentered){ hasCentered=true;
      viewer.camera.flyTo({ destination:Cesium.Cartesian3.fromDegrees(fix.lng, fix.lat, 8000), duration:3 }); }
  }catch(e){ console.error('gps render failed', e); }
}
function renderOperatorCard(fix){
  $('op-body').innerHTML=
    '<div>LAT <span class="fix-val">'+fix.lat.toFixed(5)+'</span></div>'+
    '<div>LON <span class="fix-val">'+fix.lng.toFixed(5)+'</span></div>'+
    '<div>ALT <span class="fix-val">'+Number(fix.alt||0).toFixed(0)+' m</span> · SPD <span class="fix-val">'+Number(fix.speed||0).toFixed(1)+' m/s</span></div>'+
    '<div>ACC ±<span class="fix-val">'+Number(fix.accuracy||0).toFixed(0)+' m</span> · HDG <span class="fix-val">'+Number(fix.heading||0).toFixed(0)+'°</span></div>'+
    '<div id="fix-age">—</div>';
}
// fix-age ticker + GPS dot honesty + bear state machine (amber = stale >120 s, grey = no fix)
setInterval(function(){
  if(!operatorFix){ setDot('dot-gps', null); return; }
  const el=$('fix-age'); if(!el) return;
  const age=Math.max(0, Date.now()/1000-(operatorFix.ts_epoch||0));
  const stale=age>120;
  if(operatorEntity && operatorEntity.billboard) operatorEntity.billboard.image=stale?BEAR_STALE:BEAR_LIVE; // never vanishes — she falls asleep
  el.innerHTML='FIX AGE <span class="fix-val">'+age.toFixed(0)+' s</span>'+
    (stale?' <span class="stale">STALE</span>':'')+
    (lastKnownRestore?' <span class="stale">LAST KNOWN</span>':'');
  setDot('dot-gps', stale?'warn':'live');
},1000);
// ---------- boot-restore (v1.1): last-known fix from localStorage ----------
// The bear is placed BEFORE the GPS socket connects and the camera flies home to her.
// Restore counts as centered — the first live fix never re-yanks the camera. No cache
// and no fix means no bear at all: her position is never fabricated.
function restoreLastKnownFix(){
  let cached=null;
  try{ cached=JSON.parse(localStorage.getItem('gev_last_fix')||'null'); }catch(e){ cached=null; }
  if(!cached || typeof cached.lat!=='number' || typeof cached.lng!=='number'){
    logLine('no last-known operator cache — bear waits off-stage for the first fix'); return; }
  onGpsFix({ lat:cached.lat, lng:cached.lng, alt:cached.alt||0, speed:cached.speed||0,
    accuracy:cached.accuracy||0, heading:cached.heading||null,
    ts_epoch:cached.ts_epoch||Math.floor(Date.now()/1000), restored:true });
  lastKnownRestore=true;
  const age=Math.max(0, Date.now()/1000-(cached.ts_epoch||0));
  if(operatorEntity && operatorEntity.billboard) operatorEntity.billboard.image=(age>120)?BEAR_STALE:BEAR_LIVE;
  logLine('last-known operator restored (age '+Math.round(age)+' s) — bear sleeps until the first live fix');
}
restoreLastKnownFix();
// ---------- command dispatch (Polaris tools → viewer) ----------
function setLayer(id, enabled){
  try{
    if(id==='buildings3d'){
      if(!ionUpgraded){ logLine('3D buildings need GEV_ION_TOKEN — see README_KEYS.md'); return; }
      if(buildingsTileset){ buildingsTileset.show=enabled; }
      return;
    }
    if(!layerFactories[id]) return;
    const existing=dynLayers[id];
    if(enabled && !existing){
      const layer=viewer.imageryLayers.addImageryProvider(layerFactories[id]());
      layer.alpha=0.95; dynLayers[id]=layer;
      logLine('layer on: '+id);
    } else if(!enabled && existing){
      viewer.imageryLayers.remove(existing, true); delete dynLayers[id];
      logLine('layer off: '+id);
    }
  }catch(e){ console.error('layer toggle failed', e); }
}
function syncStrip(){
  document.querySelectorAll('.layer-btn[data-layer]').forEach(function(btn){
    const id=btn.getAttribute('data-layer'); let on=false;
    if(id==='dark') on=true;
    else if(id==='buildings3d') on=!!(ionUpgraded&&buildingsTileset&&(buildingsTileset.show!==false));
    else on=!!dynLayers[id];
    btn.classList.toggle('on', on);
  });
}
function focusOperator(){
  if(!operatorFix){ logLine('no operator fix to focus'); return; }
  viewer.camera.flyTo({ destination:Cesium.Cartesian3.fromDegrees(operatorFix.lng, operatorFix.lat, 2500), duration:2 });
}
function reportCensus(args){
  try{
    const c=viewer.camera.positionCartographic;
    const census={
      query:(args&&args.query)||'all',
      camera:{ lon:+Cesium.Math.toDegrees(c.longitude).toFixed(5), lat:+Cesium.Math.toDegrees(c.latitude).toFixed(5), height:Math.round(c.height) },
      layers:{ osm:!!dynLayers.osm, imagery:!!dynLayers.imagery, buildings3d:!!(ionUpgraded&&buildingsTileset&&(buildingsTileset.show!==false)) },
      ion_token:ionUpgraded,
      operator_fix: operatorFix ? { lat:operatorFix.lat, lng:operatorFix.lng, alt:operatorFix.alt||0, age_s:Math.max(0, Math.round(Date.now()/1000-(operatorFix.ts_epoch||0))) } : null,
      ts_epoch:Date.now()/1000
    };
    gevSocket.emit('gev_census', census);
    logLine('census reported'+(census.operator_fix?' (operator fix attached)':' (no operator fix)'));
  }catch(e){ console.error('census failed', e); }
}
function dispatchCommand(cmd){
  try{
    if(!cmd||!cmd.op) return;
    logLine('<b>'+cmd.op+'</b> '+JSON.stringify(cmd.args||{}));
    if(cmd.op==='set_center'){
      const a=cmd.args||{};
      viewer.camera.flyTo({ destination:Cesium.Cartesian3.fromDegrees(Number(a.lon), Number(a.lat), Number(a.height||6000)), duration:2.2 });
    } else if(cmd.op==='toggle_layer'){
      const a=cmd.args||{}; setLayer(a.layer, !!a.enabled); syncStrip();
    } else if(cmd.op==='set_focus_operator'){ focusOperator(); }
    else if(cmd.op==='query_object'){ reportCensus(cmd.args||{}); }
  }catch(e){ console.error('dispatch failed', e); }
}

// ---------- GEV command bridge socket (this service) ----------
const gevSocket=io({ transports:['websocket','polling'] });
gevSocket.on('connect',function(){ setDot('dot-gev','live'); gevSocket.emit('join_gev',{room:'gev_dashboard'}); logLine('command bridge online'); });
gevSocket.on('disconnect',function(){ setDot('dot-gev','warn'); logLine('command bridge offline'); });
gevSocket.on('gev_update', dispatchCommand);
// ---------- GPS feed socket (burst receiver — GEV.md wireguard ingestion) ----------
const gpsSocket=io(BURST_WS, { transports:['websocket','polling'], reconnectionDelay:3000 });
gpsSocket.on('connect',function(){ gpsSocket.emit('join_gev',{room:'gev_dashboard'}); logLine('GPS feed connected'); });
gpsSocket.on('disconnect',function(){ setDot('dot-gps','warn'); });
gpsSocket.on('gev_location', function(fix){ try{ onGpsFix(fix); }catch(e){ console.error(e); } });

// ---------- Polaris command dock (REST /api/chat, identity: rich) ----------
const polarisDock=$('polaris-dock'), chatScroll=$('chat-scroll');
function chatMsg(who, txt){
  const div=document.createElement('div'); div.className='msg '+who;
  const w=document.createElement('div'); w.className='who'; w.textContent=who.toUpperCase();
  const t=document.createElement('div'); t.className='txt'; t.textContent=txt;
  div.appendChild(w); div.appendChild(t); chatScroll.appendChild(div);
  chatScroll.scrollTop=chatScroll.scrollHeight;
  while(chatScroll.children.length>24) chatScroll.firstChild.remove();
  const last=div.querySelector('.txt');
  return { replace:function(text){ last.textContent=text; } };
}
$('chat-form').addEventListener('submit', function(ev){
  ev.preventDefault();
  const input=$('chat-input'); const text=(input.value||'').trim(); if(!text) return; input.value='';
  chatMsg('rich', text);
  const pending=chatMsg('polaris', '…routing through the gateway…');
  fetch(GATEWAY+'/api/chat', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ prompt:text, user_id:'rich', client_source:'gev_dashboard', session_id:'rich_gev' }) })
    .then(function(res){ if(!res.ok) throw new Error('gateway '+res.status); return res.json(); })
    .then(function(data){
      const reply=(data && (data.response||data.reply||data.message)) || '…no reply body';
      pending.replace(reply); setDot('dot-polaris','live');
    })
    .catch(function(err){ pending.replace('⚠ '+err.message); setDot('dot-polaris','warn'); });
});

// ---------- layer strip clicks + keyboard control ----------
function toggleKeyed(id){
  if(id==='dark') return;
  if(id==='buildings3d'){
    if(!ionUpgraded){ logLine('3D buildings need GEV_ION_TOKEN — see README_KEYS.md'); return; }
    if(buildingsTileset){ buildingsTileset.show=!(buildingsTileset.show!==false); syncStrip(); }
    return;
  }
  setLayer(id, !dynLayers[id]); syncStrip();
}
document.querySelectorAll('.layer-btn[data-layer]').forEach(function(btn){
  btn.addEventListener('click', function(){ toggleKeyed(btn.getAttribute('data-layer')); });
});
window.addEventListener('keydown', function(ev){
  if(ev.target && (ev.target.tagName==='INPUT'||ev.target.tagName==='TEXTAREA')) return;
  if(ev.key==='1') toggleKeyed('osm');
  else if(ev.key==='2') toggleKeyed('imagery');
  else if(ev.key==='3') toggleKeyed('buildings3d');
  else if(ev.key==='0') focusOperator();
  else if(ev.key.toLowerCase()==='p') polarisDock.classList.toggle('hidden');
});

// ---------- smoke-test hooks (console) ----------
window.GEV={ reportCensus:reportCensus, setLayer:setLayer, focusOperator:focusOperator,
  dispatchCommand:dispatchCommand, toggleKeyed:toggleKeyed, bear:()=>operatorEntity,
  sockets:{ gev:gevSocket, gps:gpsSocket } };
syncStrip();
</script>
